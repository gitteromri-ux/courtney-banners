<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#010712;overflow:hidden;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .canvas{position:relative;width:1080px;height:1080px;overflow:hidden;background:#010712;}
</style></head><body>
<style>
  .canvas{background:#010712;}
  .photo-img{ position:absolute; right:0; top:0; width:561px; height:1080px; object-fit:cover; object-position:center 25%; z-index:1; }
  .photo-fade{ position:absolute; left:0; top:0; width:702px; height:1080px; background:linear-gradient(90deg, #010712 0%, #010712 45%, rgba(1,7,18,.85) 60%, rgba(1,7,18,.35) 78%, rgba(1,7,18,0) 100%); z-index:2; }
  .brand-top{ position:absolute; left:60px; top:51px; z-index:10; display:flex; align-items:center; }
  .brand-top img{ height:162px; display:block; }
  .text-area{ position:absolute; left:60px; top:247px; width:440px; z-index:11; color:#fff; }
  .h1{ font-family:'Playfair Display','Instrument Serif',serif; font-weight:800; font-size:90px; line-height:1.02; letter-spacing:-.015em; margin:0; color:#fff; text-shadow:0 2px 24px rgba(0,0,0,.8); }
  .h1 .b{ font-weight:900; }
  .h1 .gold{ color:#E8A75A; }
  .cred{ margin-top:27px; font-family:'Inter',sans-serif; font-weight:600; font-size:25px; letter-spacing:.01em; color:#A9CFFF; line-height:1.35; }
  .cred b{ color:#E8A75A; font-weight:800; }
  .cta-block{ margin-top:45px; display:flex; flex-direction:column; align-items:flex-start; gap:18px; }
  .cta{ display:inline-flex; align-items:center; gap:12px; background:linear-gradient(135deg,#3A8DFF 0%,#006EFF 100%); color:#fff; font-family:'Inter',sans-serif; font-weight:900; font-size:37px; padding:31px 62px; border-radius:9999px; border:1px solid rgba(255,255,255,.5); box-shadow:0 12px 36px rgba(0,110,255,.55), inset 0 2px 0 rgba(255,255,255,.3); letter-spacing:.01em; }
  .cta .arrow{ display:inline-block; margin-left:7px; }
  .tp{ display:flex; align-items:center; gap:12px; }
  .tp img.stars{ height:40px; }
  .tp .txt{ font-family:'Inter',sans-serif; font-weight:700; font-size:24px; color:#fff; letter-spacing:.01em; }
  .tp .txt .lt{ font-weight:500; color:rgba(255,255,255,.72); }
  /* subtle warm accent glow on photo side */
  .warm-glow{ position:absolute; right:-20%; top:-15%; width:70%; height:70%; background:radial-gradient(closest-side, rgba(232,167,90,.22), transparent 70%); z-index:1; pointer-events:none; }
</style>
<div class="canvas">
  <img class="photo-img" src="../assets/composites/courtney_woodset_v1.png" alt="">
  <div class="warm-glow"></div>
  <div class="photo-fade"></div>

  <div class="brand-top">
    <img src="../assets/lla_logo.png" alt="Longevity Life Academy">
  </div>

  <div class="text-area">
    <h1 class="h1"><span class="b">The Longevity Course,</span><br><span class="b gold">Taught Live.</span></h1>
    <div class="cred">With <b>Courtney</b><br>Longevity Life Academy Instructor</div>
    <div class="cta-block">
      <a class="cta">Enroll Now <span class="arrow">→</span></a>
      <div class="tp">
        <img class="stars" src="../assets/tp_stars-5.svg">
        <div class="txt">4.6 / 5<br><span class="lt">600+ verified reviews on Trustpilot</span></div>
      </div>
    </div>
  </div>
</div>
</body></html>
