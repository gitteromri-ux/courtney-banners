<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Playfair';src:url('../assets/fonts/PlayfairDisplay.ttf');font-weight:400 900;}
@font-face{font-family:'PlayfairIt';src:url('../assets/fonts/PlayfairDisplay-Italic.ttf');font-weight:400 900;font-style:italic;}
@font-face{font-family:'Inter';src:url('../assets/fonts/Inter.ttf');font-weight:100 900;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1080px;overflow:hidden;background:#0a1020;}
.stage{position:relative;width:1080px;height:1080px;overflow:hidden;}
.stage img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 24%;}
.scrim-s{position:absolute;inset:0;background:linear-gradient(to right,rgba(6,10,20,0.55) 0%,rgba(6,10,20,0.2) 46%,rgba(6,10,20,0) 78%);}
.scrim-b{position:absolute;left:0;right:0;bottom:0;height:78%;
  background:linear-gradient(to top,rgba(6,10,20,.96) 0%,rgba(6,10,20,.88) 35%,rgba(6,10,20,.55) 68%,rgba(6,10,20,0) 100%);}
.scrim-t{position:absolute;left:0;right:0;top:0;height:26%;
  background:linear-gradient(to bottom,rgba(6,10,20,.80) 0%,rgba(6,10,20,.35) 55%,rgba(6,10,20,0) 100%);}
.content{position:absolute;left:64px;right:64px;bottom:64px;}
.logo{width:370px;margin-bottom:15px;}
.logo img{width:100%;display:block;}
.eyebrow{font-family:'Inter',sans-serif;font-weight:500;color:rgba(255,255,255,.82);
  font-size:22px;margin-bottom:19px;letter-spacing:.02em;white-space:nowrap;}
h1{font-family:'Playfair',serif;font-weight:700;color:#fff;
  font-size:100px;line-height:1.04;letter-spacing:-.015em;}
h1 span{display:block;white-space:nowrap;}
h1 .it{font-family:'PlayfairIt',serif;font-style:italic;font-weight:600;
  color:#9cc2ee;}
.facts{display:inline-block;margin-top:26px;
  border-left:3px solid #5d92dd;
  background:linear-gradient(90deg,rgba(45,82,148,.30),rgba(45,82,148,0) 88%);
  padding:8px 38px 8px 22px;}
.fact{display:flex;align-items:center;gap:14px;
  font-family:'Inter',sans-serif;font-weight:500;color:#eef4fd;
  font-size:24px;line-height:1;padding:12px 0;}
.fact + .fact{border-top:1px solid rgba(150,180,230,.28);}
.fact .m{width:8px;height:8px;background:#5d92dd;transform:rotate(45deg);flex:none;}
.row{display:flex;align-items:center;gap:26px;margin-top:31px;flex-wrap:nowrap;}
.cta{font-family:'Inter',sans-serif;font-weight:600;color:#0a1428;background:#f2f6fc;
  font-size:21px;letter-spacing:.10em;padding:20px 40px;border-radius:8px;white-space:nowrap;}
.tp{display:flex;align-items:center;gap:12px;}
.tp img{height:26px;display:block;}
.tp span{font-family:'Inter',sans-serif;color:rgba(255,255,255,.88);font-size:22px;white-space:nowrap;}
.lt{position:absolute;right:64px;bottom:196px;display:flex;}
.lt .bar{width:4px;background:#5d92dd;flex:none;}
.lt .tx{background:linear-gradient(90deg,rgba(8,14,28,.74),rgba(8,14,28,.38));
  padding:13px 26px 14px 19px;}
.lt .n{font-family:'Inter',sans-serif;font-weight:600;color:#fff;
  font-size:24px;letter-spacing:.01em;white-space:nowrap;}
.lt .r{font-family:'Inter',sans-serif;font-weight:400;color:#9cc2ee;
  font-size:19px;margin-top:6px;letter-spacing:.03em;white-space:nowrap;}
</style></head><body>
<div class="stage">
  <img class="bg" src="../assets/composites/courtney_realset_sq.png">
  <div class="scrim-t"></div><div class="scrim-s"></div><div class="scrim-b"></div>
  <div class="lt"><div class="bar"></div><div class="tx">
    <div class="n">Taught live by Courtney</div>
    <div class="r">Longevity Life Academy Instructor</div>
  </div></div>
  <div class="content">
    <div class="logo"><img src="../assets/lla_logo_oneline.png"></div>
    <div class="eyebrow">Live Online Longevity Course</div>
    <h1><span class="l1">The Longevity Course,</span><span class="it">Taught Live.</span></h1>
    <div class="facts">
      <div class="fact"><span class="m"></span>18 live sessions. Cohorts of 8-15.</div>
      <div class="fact"><span class="m"></span>The Six Pillars of longevity.</div>
      <div class="fact"><span class="m"></span>Your written longevity protocol.</div>
    </div>
    <div class="row">
      <div class="cta">ENROLL NOW</div>
      <div class="tp"><img src="../assets/tp_stars-5.svg"><span>4.6 on Trustpilot</span></div>
    </div>
  </div>
</div>
<script>
(function(){
  var h1=document.querySelector('h1');
  var box=document.querySelector('.content');
  var max=box.clientWidth;
  var size=parseFloat(getComputedStyle(h1).fontSize);
  while(size>18){
    var fits=true;
    h1.querySelectorAll('span').forEach(function(s){ if(s.scrollWidth>max) fits=false; });
    if(fits) break;
    size-=1; h1.style.fontSize=size+'px';
  }
})();
</script>
</body></html>
