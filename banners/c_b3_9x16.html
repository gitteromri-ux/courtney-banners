<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0c0805;overflow:hidden;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .canvas{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0c0805;}
  .photo{position:absolute;top:-14%;left:0;width:100%;height:114%;object-fit:cover;object-position:center 30%;z-index:1;filter:saturate(.98) contrast(1.03) brightness(.96);background:#0c0805;}
  .vignette{position:absolute;inset:0;z-index:2;background:linear-gradient(180deg, rgba(14,9,5,.68) 0%, rgba(14,9,5,.15) 18%, rgba(14,9,5,0) 30%, rgba(14,9,5,.15) 55%, rgba(14,9,5,.78) 74%, rgba(10,6,3,.95) 100%);}
  .grain{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/></svg>");}
  .brand{position:absolute;left:69px;top:162px;z-index:10;display:flex;flex-direction:column;gap:29px;}
  .brand img{height:183px;display:block;opacity:.99;filter:drop-shadow(0 4px 18px rgba(2,6,20,.7));}
  .brand .eyebrow{font-family:'EB Garamond',serif;font-style:italic;font-weight:500;font-size:34px;color:#e9d9be;line-height:1.25;text-shadow:0 2px 12px rgba(10,6,3,.65);}
  .text{position:absolute;left:69px;bottom:259px;width:942px;z-index:11;color:#f7f3ec;}
  .h1{font-family:'EB Garamond',serif;font-weight:600;font-size:127px;line-height:.98;letter-spacing:-.012em;margin:0;color:#f7f3ec;text-shadow:0 5px 34px rgba(10,6,3,.7);}
  .h1 .b{font-style:italic;font-weight:500;display:block;margin-top:8px;background:linear-gradient(103deg,#f3e3c3 0%,#e6cd9d 45%,#d8b97f 75%,#eedcba 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 22px rgba(10,6,3,.6));}
  .cred{margin-top:34px;font-family:'EB Garamond',serif;font-style:italic;font-weight:500;font-size:30px;color:rgba(247,240,228,.92);line-height:1.4;}
  .cred .name{font-style:normal;font-weight:700;color:#eddcb8;}
  .offer{margin-top:16px;font-family:'Inter',sans-serif;font-weight:500;font-size:27px;color:rgba(245,248,252,.95);letter-spacing:.01em;}
  .facts{margin-top:30px;display:flex;flex-direction:column;gap:22px;}
  .facts .f{display:block;font-family:'Inter',sans-serif;font-weight:600;font-size:43px;color:#f7f3ec;line-height:1.28;letter-spacing:.008em;text-shadow:0 2px 10px rgba(10,6,3,.75);}
  .facts .f .ck{display:none;}
  .actions{margin-top:50px;display:flex;flex-direction:column;align-items:flex-start;gap:31px;}
  .cta{display:inline-flex;align-items:center;justify-content:center;background:#f2e9d8;color:#241408;font-family:'Inter',sans-serif;font-weight:700;font-size:35px;letter-spacing:.14em;padding:28px 70px;border-radius:9999px;border:0;box-shadow:0 10px 34px rgba(10,6,3,.55);}
  .tp{display:flex;align-items:center;gap:17px;}
  .tp .stars{font-size:35px;color:#00b67a;letter-spacing:.18em;line-height:1;text-shadow:0 2px 8px rgba(10,6,3,.6);}
  .tp .word{font-family:'Inter',sans-serif;font-weight:500;font-size:25px;color:rgba(247,242,233,.92);}
</style></head><body>
<div class="canvas">
  <img class="photo" src="../assets/composites/courtney_realset_pt.png" alt="">
  <div class="vignette"></div>
  <div class="grain"></div>

  <div class="brand"><img src="../assets/lla_logo_ivory.png" alt="Longevity Life Academy by eTeacher Group"><div class="eyebrow">Live Online Longevity Course</div></div>

  <div class="text">
    <h1 class="h1">Decode Your Biomarkers.<span class="b">Extend Your Life.</span></h1>
    <div class="cred">Taught live by <span class="name">Courtney</span>, Longevity Life Academy Instructor</div>
    <div class="facts">
      <div class="f"><span class="ck">✓</span><span>18 live sessions. Cohorts of 8-15.</span></div>
      <div class="f"><span class="ck">✓</span><span>The Six Pillars of longevity.</span></div>
      <div class="f"><span class="ck">✓</span><span>Your written longevity protocol.</span></div>
    </div>
    <div class="actions">
      <a class="cta">ENROLL NOW</a>
      <div class="tp">
        <span class="stars">★★★★★</span>
        <span class="word">4.6 on Trustpilot</span>
      </div>
    </div>
  </div>
</div>
</body></html>
