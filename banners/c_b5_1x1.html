<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#0a0503;overflow:hidden;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .canvas{position:relative;width:1080px;height:1080px;overflow:hidden;background:#0a0503;}
  .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:58% 32%;z-index:1;}
  .vignette{position:absolute;inset:0;z-index:2;background:linear-gradient(97deg, rgba(12,6,2,.96) 0%, rgba(14,7,3,.85) 26%, rgba(16,8,3,.45) 48%, rgba(16,8,3,0) 66%),linear-gradient(180deg, rgba(12,6,2,0) 55%, rgba(12,6,2,.55) 100%);}
  .grain{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/></svg>");}
  .brand{position:absolute;left:69px;top:49px;z-index:10;}
  .brand img{height:69px;display:block;opacity:.96;filter:drop-shadow(0 2px 10px rgba(0,0,0,.4));}
  .text{position:absolute;left:69px;bottom:69px;width:712px;z-index:11;color:#f7ede0;}
  .h1{font-family:'Fraunces',serif;font-variation-settings:'opsz' 144;font-weight:600;font-size:95px;line-height:.96;letter-spacing:-.022em;margin:0;color:#fbf3e6;text-shadow:0 5px 34px rgba(0,0,0,.62);}
  .h1 .b{font-style:italic;font-weight:500;display:block;margin-top:8px;background:linear-gradient(103deg,#f7e3b9 0%,#eac583 28%,#d29a55 55%,#f3d9a4 82%,#e6b878 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 22px rgba(0,0,0,.5));}
  .cred{margin-top:25px;font-family:'Fraunces',serif;font-style:italic;font-weight:400;font-size:23px;color:rgba(247,237,224,.88);line-height:1.4;}
  .cred .name{font-style:normal;font-weight:600;color:#f3d9a4;}
  .actions{margin-top:38px;display:flex;flex-direction:column;align-items:flex-start;gap:22px;}
  .cta{display:inline-flex;align-items:center;gap:13px;background:linear-gradient(160deg,#f3dca9 0%,#e7c084 45%,#d5a057 100%);color:#221204;font-family:'Fraunces',serif;font-weight:600;font-size:25px;letter-spacing:.012em;padding:20px 50px;border-radius:5px;box-shadow:0 10px 38px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,248,230,.65);}
  .cta .arr{font-family:'Inter',sans-serif;font-weight:500;}
  .tp{display:flex;align-items:center;gap:12px;}
  .tp img.stars{height:25px;}
  .tp .score{font-family:'Inter',sans-serif;font-weight:600;font-size:18px;color:rgba(251,243,230,.95);}
  .tp .word{font-family:'Inter',sans-serif;font-weight:400;font-size:16px;color:rgba(247,237,224,.68);}
</style></head><body>
<div class="canvas">
  <img class="photo" src="../assets/composites/courtney_lux_v2.png" alt="">
  <div class="vignette"></div>
  <div class="grain"></div>

  <div class="brand"><img src="../assets/lla_logo_ivory.png" alt="Longevity Life Academy by eTeacher Group"></div>

  <div class="text">
    <h1 class="h1">Age Slower.<span class="b">Starts in Class.</span></h1>
    <div class="cred">With <span class="name">Courtney</span>, Longevity Life Academy Instructor</div>
    <div class="actions">
      <a class="cta">Enroll Now <span class="arr">→</span></a>
      <div class="tp">
        <img class="stars" src="../assets/tp_stars-5.svg">
        <span class="score">4.6</span>
        <span class="word">600+ verified reviews on Trustpilot</span>
      </div>
    </div>
  </div>
</div>
</body></html>
