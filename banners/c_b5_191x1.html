<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#060b20;overflow:hidden;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .canvas{position:relative;width:1200px;height:628px;overflow:hidden;background:#060b20;}
  .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 45%;z-index:1;filter:saturate(.95) contrast(1.04) brightness(.94);background:#060b20;}
  .vignette{position:absolute;inset:0;z-index:2;background:linear-gradient(97deg, rgba(6,11,26,.92) 0%, rgba(8,14,30,.78) 22%, rgba(10,16,32,.42) 40%, rgba(12,18,32,.10) 56%, rgba(12,18,32,0) 66%),linear-gradient(180deg, rgba(6,11,26,.68) 0%, rgba(6,11,26,0) 20%),linear-gradient(180deg, rgba(6,11,26,0) 55%, rgba(6,11,26,.62) 100%);}
  .grain{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/></svg>");}
  .brand{position:absolute;left:49px;top:35px;z-index:10;display:flex;flex-direction:column;gap:16px;}
  .brand img{height:102px;display:block;opacity:.99;filter:drop-shadow(0 4px 18px rgba(2,6,20,.7));}
  .brand .eyebrow{font-family:'EB Garamond',serif;font-style:italic;font-weight:500;font-size:19px;color:#9cc3ef;line-height:1.25;text-shadow:0 2px 12px rgba(2,6,20,.6);}
  .text{position:absolute;left:49px;bottom:47px;width:600px;z-index:11;color:#f5f8fc;}
  .h1{font-family:'EB Garamond',serif;font-weight:600;font-size:51px;line-height:.98;letter-spacing:-.012em;margin:0;color:#f5f8fc;text-shadow:0 5px 34px rgba(2,6,20,.65);}
  .h1 .b{font-style:italic;font-weight:500;display:block;margin-top:6px;background:linear-gradient(103deg,#bcd8f7 0%,#8fb4e3 40%,#6fa1dd 70%,#a9cdf3 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 22px rgba(2,6,20,.55));}
  .cred{margin-top:22px;font-family:'EB Garamond',serif;font-style:italic;font-weight:500;font-size:16px;color:rgba(232,241,252,.9);line-height:1.4;}
  .cred .name{font-style:normal;font-weight:700;color:#9cc3ef;}
  .offer{margin-top:10px;font-family:'Inter',sans-serif;font-weight:500;font-size:14px;color:rgba(245,248,252,.95);letter-spacing:.01em;}
  .facts{margin-top:16px;display:flex;flex-direction:column;gap:10px;}
  .facts .f{display:block;font-family:'Inter',sans-serif;font-weight:700;font-size:17px;color:#8ff2ff;line-height:1.28;letter-spacing:.008em;text-shadow:0 0 6px rgba(127,231,255,.9),0 0 14px rgba(127,231,255,.7),0 0 28px rgba(90,190,255,.55),0 0 52px rgba(60,150,235,.35),0 2px 8px rgba(2,6,20,.55);}
  .facts .f .ck{display:none;}
  .actions{margin-top:30px;display:flex;flex-direction:column;align-items:flex-start;gap:18px;}
  .cta{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(20,34,72,.92) 0%,rgba(10,18,46,.94) 100%);color:#ffffff;font-family:'Inter',sans-serif;font-weight:600;font-size:18px;letter-spacing:.16em;padding:16px 36px;border-radius:9999px;border:2px solid rgba(158,196,242,.95);box-shadow:0 0 26px rgba(110,160,235,.5), 0 10px 34px rgba(2,6,20,.55), inset 0 0 18px rgba(110,160,235,.18);}
  .tp{display:flex;align-items:center;gap:10px;}
  .tp .stars{font-size:21px;color:#ffffff;letter-spacing:.18em;line-height:1;text-shadow:0 2px 10px rgba(2,6,20,.6);}
  .tp .word{font-family:'Inter',sans-serif;font-weight:500;font-size:13px;color:rgba(240,246,253,.92);}
</style></head><body>
<div class="canvas">
  <img class="photo" src="../assets/composites/courtney_wideset_v1.png" alt="">
  <div class="vignette"></div>
  <div class="grain"></div>

  <div class="brand"><img src="../assets/lla_logo.png" alt="Longevity Life Academy by eTeacher Group"><div class="eyebrow">Live Online Longevity Course</div></div>

  <div class="text">
    <h1 class="h1">Age Slower.<span class="b">Starts in Class.</span></h1>
    <div class="cred">Taught live by <span class="name">Courtney</span>, Longevity Life Academy Instructor</div>
    <div class="facts">
      <div class="f"><span class="ck">✓</span><span>18 live sessions. Cohorts of 8-15.</span></div>
      <div class="f"><span class="ck">✓</span><span>The Six Pillars of longevity.</span></div>
      <div class="f"><span class="ck">✓</span><span>Your written longevity protocol.</span></div>
    </div>
    <div class="offer">Applications open for the next cohort</div>
    <div class="actions">
      <a class="cta">ENROLL NOW</a>
      <div class="tp">
        <span class="stars">★★★★★</span>
        <span class="word">4.6 on Trustpilot</span>
      </div>
    </div>
  </div>
</div>
</body></html>
